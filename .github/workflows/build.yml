name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    name: Build (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CXX=${{ matrix.compiler }}
